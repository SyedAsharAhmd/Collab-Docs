# Render Blueprint: one Postgres database, the REST API, the collab server and the
# static client. Values marked `sync: false` are typed into the Render dashboard when
# the Blueprint is created; they are never committed.
#
# Free plan limits: web services sleep after 15 minutes idle (about a minute to wake),
# and the free database is deleted 30 days after creation.

databases:
  - name: collab-docs-db
    plan: free
    region: frankfurt

services:
  - name: collab-docs-api
    type: web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci
    # schema.sql only uses IF NOT EXISTS, so applying it on every start is safe.
    startCommand: node db/init.js && node src/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: collab-docs-db
          property: connectionString
      # Must be the same value as the collab server's JWT_SECRET.
      - key: JWT_SECRET
        sync: false
      # The client's public URL, e.g. https://collab-docs-client.onrender.com
      - key: CLIENT_ORIGIN
        sync: false
      # Proxies between the internet and the API, so rate limiting sees each client's
      # real IP. Too high lets clients fake their IP; too low makes everyone share one.
      - key: TRUST_PROXY_HOPS
        value: "3"

  - name: collab-docs-collab
    type: web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: collab
    buildCommand: npm ci
    # Creates the public demo users and welcome document if missing (never blocks start).
    startCommand: node db/seedDemo.js && node src/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: collab-docs-db
          property: connectionString
      - key: JWT_SECRET
        sync: false

  - name: collab-docs-client
    type: web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Every path serves index.html so React Router can handle /doc/:id on a reload.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Read at build time by Vite. The API's public URL, e.g. https://collab-docs-api.onrender.com
      - key: VITE_API_URL
        sync: false
      # The collab server's public URL with wss://, e.g. wss://collab-docs-collab.onrender.com
      - key: VITE_COLLAB_URL
        sync: false
